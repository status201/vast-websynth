<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A synth studio in a square: three equal rows (knobs + LED / scope / keys).
       Drawn for 16 px first. scripts/generate-icons.mjs rasterizes it into the PNG
       icons, and public/og-card.svg nests it as the card logo. -->
  <defs>
    <radialGradient id="icon-panel" cx="42%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#231a10"/>
      <stop offset="55%" stop-color="#120c06"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="icon-knob" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e9dcc0"/>
      <stop offset="50%" stop-color="#a8977a"/>
      <stop offset="100%" stop-color="#4a3e30"/>
    </radialGradient>
    <linearGradient id="icon-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf3e0"/>
      <stop offset="100%" stop-color="#d8c9a8"/>
    </linearGradient>
    <filter id="icon-glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="icon-led" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="icon-keys"><rect x="8" y="42" width="48" height="14" rx="3"/></clipPath>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#icon-panel)" stroke="#5d4628" stroke-width="1.5"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="12.5" fill="none" stroke="rgba(244,205,94,0.10)" stroke-width="1"/>

  <!-- row 1: two knobs + LED -->
  <circle cx="15" cy="15" r="5.6" fill="url(#icon-knob)" stroke="#050302" stroke-width="0.8"/>
  <line x1="14.2" y1="14.1" x2="12" y2="11.5" stroke="#120c06" stroke-width="1.9" stroke-linecap="round"/>
  <circle cx="30" cy="15" r="5.6" fill="url(#icon-knob)" stroke="#050302" stroke-width="0.8"/>
  <line x1="30.9" y1="14.2" x2="33.5" y2="12" stroke="#120c06" stroke-width="1.9" stroke-linecap="round"/>
  <circle cx="49" cy="15" r="3.3" fill="#ff3a20" filter="url(#icon-led)"/>
  <circle cx="48.3" cy="14.3" r="1" fill="#ffd0c2"/>

  <!-- row 2: scope. Two periods, so the wave reads as a wave, not a mouth under the knobs -->
  <rect x="8" y="25" width="48" height="14" rx="3" fill="#070402" stroke="#3d2e1b" stroke-width="1"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="rgba(232,116,46,0.18)" stroke-width="0.6"/>
  <path d="M12 32 C14.5 26, 19.5 26, 22 32 S 29.5 38, 32 32 S 39.5 26, 42 32 S 49.5 38, 52 32" fill="none" stroke="#e8742e" stroke-width="2.4" stroke-linecap="round" filter="url(#icon-glow)"/>

  <!-- row 3: keys (C D E F G, black C# D# F#) -->
  <g clip-path="url(#icon-keys)">
    <rect x="8" y="42" width="48" height="14" fill="url(#icon-ivory)"/>
    <g stroke="#3d2e1b" stroke-width="0.8">
      <line x1="17.6" y1="42" x2="17.6" y2="56"/>
      <line x1="27.2" y1="42" x2="27.2" y2="56"/>
      <line x1="36.8" y1="42" x2="36.8" y2="56"/>
      <line x1="46.4" y1="42" x2="46.4" y2="56"/>
    </g>
    <g fill="#120c06">
      <rect x="14.8" y="42" width="5.6" height="8.5" rx="0.8"/>
      <rect x="24.4" y="42" width="5.6" height="8.5" rx="0.8"/>
      <rect x="43.6" y="42" width="5.6" height="8.5" rx="0.8"/>
    </g>
  </g>
  <rect x="8" y="42" width="48" height="14" rx="3" fill="none" stroke="#3d2e1b" stroke-width="1"/>
</svg>
