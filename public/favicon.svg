<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- warm panel vignette -->
    <radialGradient id="panel" cx="42%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#231a10"/>
      <stop offset="55%" stop-color="#120c06"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <!-- knob body: light catches upper-left, falls to near-black -->
    <radialGradient id="knob" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#4a4034"/>
      <stop offset="42%" stop-color="#2a2218"/>
      <stop offset="78%" stop-color="#16100a"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <linearGradient id="pointer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0bf"/>
      <stop offset="55%" stop-color="#f4cd5e"/>
      <stop offset="100%" stop-color="#d99a2e"/>
    </linearGradient>
    <filter id="glowAcc" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLed" x="-160%" y="-180%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#panel)"
        stroke="#5d4628" stroke-width="1.5"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="12.5" fill="none"
        stroke="rgba(244,205,94,0.10)" stroke-width="1"/>

  <!-- tick ring: every 35° across the 280° sweep (-140°..+140°) -->
  <g stroke="#6b5436" stroke-width="1.4" stroke-linecap="round">
    <line x1="32" y1="4.5" x2="32" y2="7.5" transform="rotate(-140 32 32)"/>
    <line x1="32" y1="4.5" x2="32" y2="7.5" transform="rotate(-105 32 32)"/>
    <line x1="32" y1="4.5" x2="32" y2="7.5" transform="rotate(-70 32 32)"/>
    <line x1="32" y1="4.5" x2="32" y2="7.5" transform="rotate(-35 32 32)"/>
    <line x1="32" y1="4.5" x2="32" y2="7.5"/>
    <line x1="32" y1="4.5" x2="32" y2="7.5" transform="rotate(35 32 32)"/>
    <line x1="32" y1="4.5" x2="32" y2="7.5" transform="rotate(70 32 32)"/>
    <line x1="32" y1="4.5" x2="32" y2="7.5" transform="rotate(105 32 32)"/>
    <line x1="32" y1="4.5" x2="32" y2="7.5" transform="rotate(140 32 32)"/>
  </g>

  <!-- value-arc track (faint gold) -->
  <path d="M 15.93 51.15 A 25 25 0 1 1 48.07 51.15"
        fill="none" stroke="rgba(244,205,94,0.16)"
        stroke-width="4" stroke-linecap="round"/>
  <!-- value arc filled to ~72% of sweep, glowing orange -->
  <path d="M 15.93 51.15 A 25 25 0 1 1 53.99 20.11"
        fill="none" stroke="#e8742e" stroke-width="4"
        stroke-linecap="round" filter="url(#glowAcc)"/>

  <!-- knob body -->
  <circle cx="32" cy="32" r="17" fill="url(#knob)"
          stroke="rgba(0,0,0,0.55)" stroke-width="1"/>
  <!-- rim highlight: catches light along the upper edge -->
  <path d="M 16.6 24.8 A 17 17 0 0 1 42.9 19" fill="none"
        stroke="rgba(244,205,94,0.18)" stroke-width="1.4"
        stroke-linecap="round"/>

  <!-- indicator pointer (gold) at the 72% position -->
  <line x1="36.9" y1="29.4" x2="45.6" y2="24.7"
        stroke="url(#pointer)" stroke-width="3.4"
        stroke-linecap="round" filter="url(#glowGold)"/>

  <!-- power LED (doesn't look good at small favicon sizes) -->
  <!--
  <circle cx="32" cy="53.8" r="2.6" fill="#ff3a20" filter="url(#glowLed)"/>
  <circle cx="32.0" cy="53.8" r="0.9" fill="#ffd0c2"/>
  -->
</svg>
