    <noscript>
      <main style="max-width: 42rem; margin: 3rem auto; padding: 0 1.25rem; color: #e8d8b6; font-family: Georgia, serif; line-height: 1.6;">
        <h1>VAST G1-J8 — Open Source Browser Synthesizer</h1>
        <p>
          VAST G1-J8 is a free, in-browser polyphonic subtractive synthesizer
          built on the Web Audio API — no install and no signup. It runs
          entirely in your browser and requires JavaScript to be enabled.
        </p>
        <h2>What it does</h2>
        <ul>
          <li>8-voice polyphonic synth: dual oscillators, sub oscillator, noise, and unison.</li>
          <li>Moog-style 4-pole ladder filter with resonance and drive.</li>
          <li>Two ADSR envelopes and an LFO routable to cutoff, pitch, amp, or pulse width.</li>
          <li>FX chain: distortion, wah, phaser, delay, and reverb.</li>
          <li>Arpeggiator, 16-step note sequencer, 8-track drum machine, and an 8-slot sampler.</li>
          <li>Record and edit samples from your microphone, build song-chain arrangements, and apply live DJ FX.</li>
          <li>Export to WAV/MP3 and save/load songs as portable JSON files. Play with the on-screen keyboard, your computer keyboard, or Web MIDI.</li>
        </ul>
        <p>
          VAST G1-J8 is free and open source — the full source code is on
          <a href="https://github.com/status201/vast-websynth" style="color: #f4cd5e;">GitHub</a>.
        </p>
        <p>Please enable JavaScript to use the synthesizer.</p>
      </main>
    </noscript>
