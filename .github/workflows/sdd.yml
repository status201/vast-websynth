name: SDD

# Spec-before-code gate: a PR that changes production code must also change a spec.
# Mirrors the local Claude Code hooks (scripts/sdd-guard.mjs) so the rule also
# applies to non-Claude agents. The structure lint additionally runs on direct
# pushes to main (the guard needs a PR base to diff against). Bypass a genuinely
# trivial production change with [skip-sdd] in a commit message or the 'skip-sdd' label.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdd-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The spec-before-code diff needs a PR base branch; on direct pushes to
      # main only the (self-contained) structure lint below runs.
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}"
      - name: Spec-before-code check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          SDD_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-sdd') }}
        run: node scripts/sdd-guard.mjs ci
      - name: Spec structure lint
        run: node scripts/spec-lint.mjs
